name: Textora
options:
  minimumXcodeGenVersion: 2.38.0
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.textora.app
    MACOSX_DEPLOYMENT_TARGET: "14.0"
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
  TranscribeCppBinary:
    path: Packages/TranscribeCppBinary
targets:
  Textora:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
    settings:
      base:
        INFOPLIST_FILE: Sources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/Textora.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.textora.app
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 35Q2T38T7Q
      configs:
        Release:
          ENABLE_APP_SANDBOX: NO
          ENABLE_HARDENED_RUNTIME: YES
          ENABLE_OUTGOING_NETWORK_CONNECTIONS: NO
          ENABLE_USER_SELECTED_FILES: NO
    dependencies:
      - package: Sparkle
      - package: TranscribeCppBinary
        product: CTranscribe
    scheme:
      testTargets:
        - TextoraTests
  TextoraTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: TextoraTests
      - path: Sources/GrammarlyRewritePlanner.swift
    dependencies:
      - target: Textora
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.textora.tests
        GENERATE_INFOPLIST_FILE: YES
